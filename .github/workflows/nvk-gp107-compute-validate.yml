name: NVK GP107 compute harness validation

on:
  push:
    paths:
      - "tests/nvk-gp107-vector-add/**"
      - ".github/workflows/nvk-gp107-compute-validate.yml"
  pull_request:
    paths:
      - "tests/nvk-gp107-vector-add/**"
      - ".github/workflows/nvk-gp107-compute-validate.yml"

permissions:
  contents: read

jobs:
  source-and-build-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install compile-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libvulkan-dev glslang-tools spirv-tools

      - name: Compile shader, validate SPIR-V, and link C harness
        shell: bash
        run: |
          set -euo pipefail
          cd tests/nvk-gp107-vector-add
          {
            echo "PHYSICAL_GPU_TEST=NOT_RUN"
            cc --version | head -n 1
            glslangValidator --version | head -n 2
            spirv-val --version | head -n 1
            pkg-config --modversion vulkan
            glslangValidator -V --target-env vulkan1.1 \
              -o vector_add.spv vector_add.comp
            spirv-val --target-env vulkan1.1 vector_add.spv
            spirv-dis vector_add.spv -o vector_add.spvasm
            cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
              -o nvk-vector-add nvk-vector-add.c -lvulkan
            file nvk-vector-add vector_add.spv
            sha256sum nvk-vector-add.c vector_add.comp vector_add.spv \
              vector_add.spvasm nvk-vector-add
          } 2>&1 | tee validation.log

      - name: Upload build evidence (no GPU runtime)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvk-gp107-source-build-validation
          path: |
            tests/nvk-gp107-vector-add/validation.log
            tests/nvk-gp107-vector-add/vector_add.spv
            tests/nvk-gp107-vector-add/vector_add.spvasm
            tests/nvk-gp107-vector-add/nvk-vector-add
          if-no-files-found: ignore
