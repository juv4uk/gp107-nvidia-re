name: GP107 static Pascal validation

on:
  pull_request:
    paths:
      - ".github/workflows/gp107-static-validation.yml"
      - "Makefile"
      - "pascal/**"
      - "lib/**"
      - "scripts/test-pascal-probe.sh"
      - "scripts/test-capability-driver.sh"

permissions:
  contents: read

concurrency:
  group: gp107-static-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-compile:
    name: Static gate and FPC 3.2.2 compile (no hardware access)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Free Pascal toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 make binutils
          test "$(fpc -iV)" = "3.2.2"
          fpc -iV
          uname -srm

      - name: Check shell syntax
        run: bash -n scripts/test-pascal-probe.sh

      - name: Evidence manifest integrity
        # ~2 minutes: 140 manifests verify, 2 are recorded debt in
        # scripts/manifest-exceptions.txt, 1 is a deliberate negative control.
        run: bash scripts/test-evidence-manifest.sh

      - name: Driver-overreach firewall
        # Static and host-runnable: no GPU, no root. It was in the tree but
        # no workflow ran it, so a regression would have been invisible.
        run: bash scripts/check-no-driver-overreach.sh

      - name: Run host-independent fail-closed source guard
        run: make test-valid-cards-static

      - name: Compile Pascal probes without executing them
        run: make -C pascal clean all

      - name: Compile Pascal capability driver and C11 identity, run fail-closed gate
        run: |
          set -euo pipefail
          make -C lib clean all
          make -C pascal gp107ctl-pascal
          bash scripts/test-capability-driver.sh

      - name: Check patch whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff --check "origin/${BASE_REF}...HEAD"

      - name: Report hardware boundary
        run: |
          {
            echo "## GP107 static validation"
            echo ""
            printf -- '- FPC: `%s`\n' "$(fpc -iV)"
            echo "- Static source guard: passed"
            echo "- Pascal compilation: passed; no probe executable was run"
            echo "- C11 capability identity: compiled with -Werror; fail-closed gate passed"
            echo "- Pascal capability driver: FPC 3.2.2, byte-identical to C on fixtures"
            echo "- x86-64 assembly slice: C/asm equivalence checked; no hardware MMIO"
            echo "- GPU/RM/MMIO/firmware/reboot: NOT_RUN (MMIO seam read-only and opt-in)"
            echo "- Multi-NVIDIA runtime negative: NOT_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
