name: GP107 valid-cards static guard

on:
  push:
    branches: [master]
    paths:
      - "Makefile"
      - "pascal/03_rm_arch_info.pas"
      - "scripts/test-pascal-probe.sh"
      - ".github/workflows/valid-cards-static.yml"
  pull_request:
    paths:
      - "Makefile"
      - "pascal/03_rm_arch_info.pas"
      - "scripts/test-pascal-probe.sh"
      - ".github/workflows/valid-cards-static.yml"

permissions:
  contents: read

jobs:
  static-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/test-pascal-probe.sh
      - name: Run fail-closed valid-cards guard (no FPC/GPU/RM)
        run: make test-valid-cards-static
      - name: Check patch hygiene
        run: git diff --check
